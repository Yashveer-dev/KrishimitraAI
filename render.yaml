services:
  # PostgreSQL Database Service
  type: pserv
  name: krishimitrai-db
  env: python
  plan: free
  buildCommand: "echo 'No build required for PostgreSQL'"
  startCommand: "echo 'PostgreSQL managed by Render'"
  databaseName: krishimitrai_prod
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  connectionLimit: 90
  
  # FastAPI Backend Service
  type: web
  name: krishimitrai-api
  env: python
  plan: free
  buildCommand: "pip install -r requirements.txt"
  startCommand: "gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
  envVars:
    - key: DATABASE_URL
      value: ${DATABASE_URL}
    - key: SECRET_KEY
      value: ${SECRET_KEY}
    - key: ENVIRONMENT
      value: production
    - key: OPENWEATHER_API_KEY
      value: ${OPENWEATHER_API_KEY}
    - key: ALLOWED_ORIGINS
      value: ${ALLOWED_ORIGINS}
    - key: POSTGRES_USER
      sync: false
    - key: POSTGRES_PASSWORD
      sync: false
    - key: POSTGRES_DB
      sync: false
    - key: POSTGRES_HOST
      sync: false
    - key: POSTGRES_PORT
      sync: false
  healthCheckPath: /health
  autoDeploy: true
  
  # React Frontend Service
  type: web
  name: krishimitrai-frontend
  env: static
  plan: free
  buildCommand: "cd frontend && npm install && npm run build"
  startCommand: "cd frontend && npm start"
  envVars:
    - key: REACT_APP_API_URL
      value: ${API_URL}
  staticPublishPath: ./frontend/build
  routes:
    - type: redirect
      source: /*
      destination: /index.html
  healthCheckPath: /
  autoDeploy: true
