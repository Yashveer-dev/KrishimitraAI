services:
  # FastAPI Backend Service
  type: web
  name: krishimitraai-api
  env: python
  plan: free
  buildCommand: "pip install -r requirements.txt"
  startCommand: "gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
  envVars:
    - key: DATABASE_URL
      value: ${DATABASE_URL}
    - key: SECRET_KEY
      value: ${SECRET_KEY}
    - key: ENVIRONMENT
      value: production
    - key: OPENWEATHER_API_KEY
      value: ${OPENWEATHER_API_KEY}
    - key: ALLOWED_ORIGINS
      value: https://krishimitraai.vercel.app,https://krishimitraai.vercel.app/*
    - key: POSTGRES_USER
      sync: false
    - key: POSTGRES_PASSWORD
      sync: false
    - key: POSTGRES_DB
      sync: false
  healthCheckPath: /health
  autoDeploy: true
  
  # PostgreSQL Database Service
  type: pserv
  name: krishimitraai-db
  env: python
  plan: free
  buildCommand: "echo 'No build required for PostgreSQL'"
  startCommand: "echo 'PostgreSQL managed by Render'"
  databaseName: krishimitrai_prod
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  connectionLimit: 90
